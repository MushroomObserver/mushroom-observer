# GitHub Actions Continuous Integration of MO Rails Code
# Runs the tests and publishes the results to Coveralls
name: Continuous Integration

on:
  push:
    # branches: main
    branches:
      - "*" # Run on pushes on all branches
  pull_request:
    branches: main

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      PARALLEL_WORKERS: 4
    steps:
      # check-out repo under $GITHUB_WORKSPACE, so that workflow can access it.
      # https://github.com/actions/checkout
      - name: Checkout code
        uses: actions/checkout@v7

      # MushroomObserver/icon-library is private (licensed Glyphicons
      # source material), so mo-icons.svg -- the curated derivative
      # sprite -- isn't committed to this (public, MIT-licensed) repo.
      # ICON_LIBRARY_PAT is a fine-grained PAT scoped to read-only
      # Contents access on icon-library only. Not available on
      # pull_request runs from forks (GitHub doesn't expose repo
      # secrets there) -- skips rather than fails, matching the
      # best-effort stance
      # script/dev_setup_components/sync_mo_icon_library.sh already
      # takes for devs without icon-library access. An
      # expired (rather than missing) token is NOT covered by this
      # skip -- git clone fails with a bad-credentials error, which
      # fails the step loudly, since $ICON_LIBRARY_PAT is still
      # non-empty in that case.
      #
      # Auth via a request header (-c http.extraHeader), not a
      # token-in-the-URL -- the latter gets persisted verbatim into
      # the clone's own .git/config, leaving the PAT sitting in
      # plaintext on disk for the rest of the job.
      - name: Fetch icon-library sprite
        env:
          ICON_LIBRARY_PAT: ${{ secrets.ICON_LIBRARY_PAT }}
        run: |
          if [ -n "$ICON_LIBRARY_PAT" ]; then
            auth=$(printf 'x-access-token:%s' "$ICON_LIBRARY_PAT" | base64 -w 0)
            git -c http.extraHeader="AUTHORIZATION: basic $auth" \
              clone --quiet --filter=blob:none --sparse \
              https://github.com/MushroomObserver/icon-library.git \
              vendor/assets/images/icons
            source script/icon_library_narrow_checkout.sh
            icon_library_narrow_checkout vendor/assets/images/icons ||
              echo "::warning::Narrowing the icon-library checkout failed -- continuing with whatever was cloned."
            if [ -f vendor/assets/images/icons/mo-icons.svg ]; then
              echo "Cloned icon-library -- mo-icons.svg present."
            else
              echo "::warning::Cloned icon-library but mo-icons.svg is missing -- check its main branch."
            fi
          else
            echo "ICON_LIBRARY_PAT not set -- skipping icon sprite fetch."
          fi

      # https://github.com/ruby/setup-ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs bundle install, caches gems

      - name: Install additional tools
        # imagemagick provides `convert`, used by Image::Dhash (#4585); its
        # tests skip themselves when it is absent, so without this they
        # would silently not run in CI.
        run: sudo apt-get install exiftool imagemagick

      # 2025-05-12 JDC Skip this step for now because it hangs intermittently
      # and is needed only for system tests, which are currently not run in CI.
      # - name: Install Chrome/Chromium
      #   run: sudo apt-get install chromium-browser

      # MySQL is installed but does not run by default
      # https://github.com/actions/virtual-environments/blob/main/images/linux/Ubuntu2004-README.md#mysql
      - name: Start mySQL
        run: sudo systemctl start mysql.service

      - name: Create and configure db
        run: |
          mysql -u root -proot < db/initialize.sql
          cp db/ubuntu/database.yml config

      - name: Create test image directories
        run: |
          for dir in images test_images;
          do
              for subdir in thumb 320 640 960 1280 orig;
              do
                mkdir -p public/$dir/$subdir
              done
          done

      - name: install exifautotran
        run: |
          sudo cp script/exifautotran /usr/local/bin/exifautotran
          sudo chmod 755 /usr/local/bin/exifautotran

      - name: Load fixtures
        run: |
          bundle exec rake db:schema:load
          bundle exec rake db:fixtures:load

      - name: Create parallel test databases from main
        run: |
          mysqldump -u root -proot mo_test > /tmp/mo_test.sql
          for i in $(seq 0 $((PARALLEL_WORKERS - 1))); do
            mysql -u root -proot -e "DROP DATABASE IF EXISTS \`mo_test-$i\`; CREATE DATABASE \`mo_test-$i\` DEFAULT CHARACTER SET utf8 DEFAULT COLLATE utf8_general_ci;"
            mysql -u root -proot "mo_test-$i" < /tmp/mo_test.sql
          done

      - name: Update translation files
        run: bundle exec rake lang:update

      - name: Create log files
        run: |
          touch log/test.log
          touch log/production.log

      - name: Set up parallel test config files
        run: bundle exec rake parallel:test:setup

      # And finally we can run the test suite
      # `pipefail` makes this step's own exit code reflect `rails test`,
      # not `tee` (which always exits 0) -- so the tee'd log capture
      # below can't mask a real test failure as a passing step.
      - name: Run tests
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          set -o pipefail
          bundle exec rails test 2>&1 | tee test_output.log

      # Make Deprecation warnings (and similar) visible.
      # `::warning::` annotations surface as yellow flags
      # on the workflow run/PR checks without affecting job status.
      # `if: always()` so warnings still surface even if tests failed.
      - name: Check for deprecation warnings
        if: always()
        run: |
          if [ -f test_output.log ] && grep -q "DEPRECATION WARNING" test_output.log; then
            grep "DEPRECATION WARNING" test_output.log | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::warning::$escaped"
            done
          fi

      # https://github.com/marketplace/actions/coveralls-github-action
      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov/lcov.info

  lint:
    runs-on: ubuntu-22.04
    steps:
      # check-out repo under $GITHUB_WORKSPACE, so that workflow can access it.
      # https://github.com/actions/checkout
      - name: Checkout code
        uses: actions/checkout@v7

      # https://github.com/ruby/setup-ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs bundle install, caches gems      # See Rails 8 default
      # https://github.com/rails/rails/blob/4a78dcb326e57b5035c4df322e31875bfa74ae23/.github/workflows/rubocop.yml#L1
      - name: Run RuboCop
        run: bundle exec rubocop --parallel

      # https://github.com/reviewdog/action-brakeman
      # - name: Run Brakeman
      #   uses: reviewdog/action-brakeman@v2
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     reporter: github-pr-check
      #     fail_level: none
