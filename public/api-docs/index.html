<!doctype html>
<html lang="en">
  <head>
    <title>Mushroom Observer API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { margin: 0; padding: 0; }
      #topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 20px;
        background: #263238;
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
      }
      #topbar a { color: #8fd694; }
    </style>
  </head>
  <body>
    <!--
      Renders public/api-docs/openapi.yaml with Redoc. The spec is
      generated by `bin/rails api:openapi` from the API2 param metadata;
      the same task stamps the spec-url's ?v= content hash below, which
      busts the browser cache (public/ files are served with a long
      max-age). Redoc is loaded from a CDN here; for production hosting
      we may vendor redoc.standalone.js locally to satisfy the site CSP
      (see the API-docs issue).
    -->
    <div id="topbar">
      <span>Mushroom Observer API</span>
      <a href="/account/api_keys">Get an API key</a>
    </div>
    <redoc spec-url="./openapi.yaml?v=006c105d"></redoc>
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
