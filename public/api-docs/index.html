<!doctype html>
<html>
  <head>
    <title>Mushroom Observer API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>body { margin: 0; padding: 0; }</style>
  </head>
  <body>
    <!--
      Renders public/api-docs/openapi.yaml with Redoc. The spec is
      generated by `bin/rails api:openapi` from the API2 param metadata.
      Redoc is loaded from a CDN here; for production hosting we may
      vendor redoc.standalone.js locally to satisfy the site CSP (see
      the API-docs issue).
    -->
    <redoc spec-url="./openapi.yaml"></redoc>
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
