---
openapi: 3.1.0
info:
  title: Mushroom Observer API
  version: '2.0'
  description: REST-ish API for creating, reading, and modifying Mushroom Observer
    records. Authentication uses an [API key](/account/api_keys). XML output is deprecated
    and undocumented here; use JSON.
servers:
- url: https://mushroomobserver.org
paths:
  "/api2/api_keys":
    post:
      summary: Create api_key
      security:
      - api_key: []
      parameters:
      - "$ref": "#/components/parameters/detail"
      - "$ref": "#/components/parameters/page"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                for_user:
                  type: string
                  description: user you are creating api key for
                app:
                  type: string
                  description: identifier used to help user distinguish which api
                    key belongs to which app
                password:
                  type: string
                  description: password of the user you are creating an API key for
      responses:
        '200':
          description: Matching api_keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: number
                  run_date:
                    type: string
                    format: date-time
                  user:
                    type: integer
                  query:
                    type: string
                  number_of_records:
                    type: integer
                  number_of_pages:
                    type: integer
                  page_number:
                    type: integer
                  run_time:
                    type: number
                  results:
                    description: matching ids at `detail=none` (the default); the
                      objects documented here at `low`, with nested detail at `high`
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: object
                        properties:
                          id:
                            type: integer
                          type:
                            type: string
                          key:
                            type: string
                          notes:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                          last_used:
                            type: string
                            format: date-time
                          verified:
                            type: string
                            format: date-time
                          num_uses:
                            type: integer
