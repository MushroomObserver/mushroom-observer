shared:
  adapter: trilogy
  # Matches most tables -- Issue #4625 (converting all tables to
  # utf8mb4_0900_ai_ci) is still open; only a few are there yet.
  encoding: utf8mb4
  collation: utf8mb4_general_ci
  variables:
    sql_mode: TRADITIONAL

# Every role connects over the same TCP address.
connection: &connection
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "mo") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "mo") %>
  port: 3306

development:
  primary:
    <<: *connection
    database: <%= ENV.fetch("DATABASE_NAME", "mo_development") %>
  cache:
    <<: *connection
    database: cache_development
    migrations_paths: "db/cache/migrate"

test:
  <<: *connection
  database: "<%= ENV['MO_TEST_DATABASE'] || (ENV['TEST_ENV_NUMBER'].to_s.empty? && 'mo_test') || 'mo_test-' + ENV['TEST_ENV_NUMBER'] %>"

# Reached over the network either way -- host, a Kamal accessory
# container, or a managed service (#5345's decision).
production:
  primary:
    <<: *connection
    database: <%= ENV.fetch("DATABASE_NAME", "mo_production") %>
    # Must exceed Solid Queue's thread need -- the worker role
    # (bin/jobs) too, not just Puma -- see queue_config_test.rb.
    pool: <%= ENV.fetch("DATABASE_POOL", 10) %>
  cache:
    <<: *connection
    database: <%= ENV.fetch("CACHE_DATABASE_NAME", "cache_production") %>
    migrations_paths: "db/cache/migrate"
